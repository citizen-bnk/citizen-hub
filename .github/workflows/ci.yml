name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_STACK_PROJECT_ID: 00000000-0000-4000-8000-000000000000
          VITE_STACK_PUBLISHABLE_CLIENT_KEY: pck_ci
